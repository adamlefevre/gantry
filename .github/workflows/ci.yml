name: Control plane CI
# Actions are pinned to commit SHAs (Dependabot keeps them current: .github/dependabot.yml).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  control-plane:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # No install scripts: a compromised dependency can't run code at install time.
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/control-plane

      - name: Run offline tests (Vitest + Miniflare)
        run: npm test

  execution-sandbox:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r services/execution-sandbox/requirements-test.txt

      - name: Run offline sandbox service tests (fake modal)
        run: python -m pytest -q services/execution-sandbox/tests
