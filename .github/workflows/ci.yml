name: Control plane CI
# Actions are pinned to commit SHAs (Dependabot keeps them current: .github/dependabot.yml).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  control-plane:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        # No install scripts: a compromised dependency can't run code at install time.
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/control-plane

      - name: Run offline tests (Vitest + Miniflare)
        run: npm test

  execution-sandbox:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r services/execution-sandbox/requirements-test.txt

      - name: Run offline sandbox service tests (fake modal)
        run: python -m pytest -q services/execution-sandbox/tests
