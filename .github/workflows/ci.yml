name: Control plane CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  control-plane:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/control-plane

      - name: Run offline tests (Vitest + Miniflare)
        run: npm test

  execution-sandbox:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install -r services/execution-sandbox/requirements-test.txt

      - name: Run offline sandbox service tests (fake modal)
        run: python -m pytest -q services/execution-sandbox/tests
