name: Control plane CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  control-plane:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit
        working-directory: apps/control-plane

      - name: Run offline tests (Vitest + Miniflare)
        run: npm test
